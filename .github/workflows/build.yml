name: PlatformIO Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio intelhex

      - name: Install Web Dependencies
        run: |
          cd web
          npm install

      - name: Run PlatformIO Build
        run: |
          pio run -t buildfs -t merge_bin

      - name: Rename Merged Binaries
        run: |
          mkdir -p artifacts
          [ -f .pio/build/pico32/firmware_merged.bin ] && cp .pio/build/pico32/firmware_merged.bin artifacts/bl_firmware_pico32.bin || echo "pico32 merged bin not found"
          [ -f .pio/build/s3/firmware_merged.bin ] && cp .pio/build/s3/firmware_merged.bin artifacts/bl_firmware_s3.bin || echo "s3 merged bin not found"
          [ -f .pio/build/c3/firmware_merged.bin ] && cp .pio/build/c3/firmware_merged.bin artifacts/bl_firmware_c3.bin || echo "c3 merged bin not found"

      - name: Upload Firmware Binaries
        uses: actions/upload-artifact@v4
        with:
          name: BambuLights-Firmware
          path: |
            artifacts/*.bin
            .pio/build/**/firmware.bin
            .pio/build/**/littlefs.bin
