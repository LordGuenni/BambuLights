name: PlatformIO Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio intelhex

      - name: Install Web Dependencies
        run: |
          cd web
          npm install

      - name: Build Firmware (Pico32)
        run: pio run -e pico32 -t buildfs -t merge_bin

      - name: Build Firmware (S3)
        run: pio run -e s3 -t buildfs -t merge_bin

      - name: Build Firmware (C3)
        run: pio run -e c3 -t buildfs -t merge_bin

      - name: Prepare Assets
        run: |
          mkdir -p artifacts
          echo "Scanning .pio/build for binaries..."
          ls -R .pio/build
          
          # Use a loop to robustly find and rename binaries for all successful environments
          for dir in .pio/build/*/ ; do
            env_name=$(basename "$dir")
            # Look for merged binary first
            if [ -f "${dir}firmware_merged.bin" ]; then
              echo "Found merged binary for $env_name"
              cp -v "${dir}firmware_merged.bin" "artifacts/bl_firmware_${env_name}.bin"
            elif [ -f "${dir}firmware.bin" ]; then
              echo "Found standard binary for $env_name"
              cp -v "${dir}firmware.bin" "artifacts/bl_firmware_${env_name}_ota.bin"
            fi
            
            # Also grab the filesystem image if it exists
            if [ -f "${dir}littlefs.bin" ]; then
              cp -v "${dir}littlefs.bin" "artifacts/bl_web_${env_name}.bin"
            fi
          done
          
          echo "Final artifacts ready for release:"
          ls -lh artifacts/

      - name: Update Nightly Tag
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -f nightly
          git push -f origin nightly

      - name: Nightly Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: "Nightly Build"
          prerelease: true
          body: "Automated nightly build from branch ${{ github.ref_name }} (commit ${{ github.sha }})"
          files: artifacts/*.bin
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (Job Backup)
        uses: actions/upload-artifact@v7
        with:
          name: BambuLights-Firmware
          path: artifacts/*.bin
