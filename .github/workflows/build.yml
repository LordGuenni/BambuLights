name: PlatformIO Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio intelhex

      - name: Install Web Dependencies
        run: |
          cd web
          npm install

      - name: Build Firmware (Pico32)
        run: pio run -e pico32 -t buildfs -t merge_bin

      - name: Build Firmware (S3)
        run: pio run -e s3 -t buildfs -t merge_bin

      - name: Build Firmware (C3)
        run: pio run -e c3 -t buildfs -t merge_bin

      - name: Prepare Assets
        run: |
          mkdir -p artifacts
          [ -f .pio/build/pico32/firmware_merged.bin ] && cp -v .pio/build/pico32/firmware_merged.bin artifacts/bl_firmware_pico32.bin
          [ -f .pio/build/s3/firmware_merged.bin ] && cp -v .pio/build/s3/firmware_merged.bin artifacts/bl_firmware_s3.bin
          [ -f .pio/build/c3/firmware_merged.bin ] && cp -v .pio/build/c3/firmware_merged.bin artifacts/bl_firmware_c3.bin
          ls -lh artifacts/

      - name: Update Nightly Tag
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -f nightly
          git push -f origin nightly

      - name: Nightly Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Build"
          prerelease: true
          body: "Automated nightly build from branch ${{ github.ref_name }} (commit ${{ github.sha }})"
          files: artifacts/bl_firmware_*.bin
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (Job Backup)
        uses: actions/upload-artifact@v4
        with:
          name: BambuLights-Firmware
          path: artifacts/bl_firmware_*.bin
