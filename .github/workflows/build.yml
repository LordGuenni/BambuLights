name: PlatformIO Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio intelhex

      - name: Install Web Dependencies
        run: |
          cd web
          npm install

      - name: Run PlatformIO Build
        run: |
          pio run -t buildfs -t merge_bin

      - name: Prepare Assets
        run: |
          mkdir -p artifacts
          echo "Finding merged binaries..."
          find .pio/build -name "firmware_merged.bin"
          
          [ -f .pio/build/pico32/firmware_merged.bin ] && cp -v .pio/build/pico32/firmware_merged.bin artifacts/bl_firmware_pico32.bin || echo "pico32 merged bin not found"
          [ -f .pio/build/s3/firmware_merged.bin ] && cp -v .pio/build/s3/firmware_merged.bin artifacts/bl_firmware_s3.bin || echo "s3 merged bin not found"
          [ -f .pio/build/c3/firmware_merged.bin ] && cp -v .pio/build/c3/firmware_merged.bin artifacts/bl_firmware_c3.bin || echo "c3 merged bin not found"
          
          echo "Contents of artifacts directory:"
          ls -R artifacts

      - name: Update Nightly Tag
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -f nightly
          git push -f origin nightly

      - name: Nightly Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Build"
          prerelease: true
          body: "Automated nightly build from branch ${{ github.ref_name }} (commit ${{ github.sha }})"
          files: |
            artifacts/bl_firmware_pico32.bin
            artifacts/bl_firmware_s3.bin
            artifacts/bl_firmware_c3.bin
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (Job Backup)
        uses: actions/upload-artifact@v4
        with:
          name: BambuLights-Firmware-Files
          path: artifacts/*.bin
